<style>
:root{--green:#073421;--green2:#124d2d;--lime:#e9f0d9;--cream:#fbf8ef;--paper:#fffefa;--gold:#efa930;--ink:#10291b;--muted:#687268;--line:#e5e0d2;--shadow:0 12px 24px #162c1713;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:16px var(--sans);color:var(--ink)}button,input,select{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}button{color:inherit}header{height:62px;background:var(--green);color:#f8f6e9;display:flex;align-items:center;gap:20px;padding:0 16px;position:sticky;top:0;z-index:9;box-shadow:0 2px 4px #0001}.brand{display:flex;align-items:center;gap:9px;font:700 22px var(--serif);white-space:nowrap}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid #d7e6b5;font-size:23px}.nav{display:flex;align-items:center;justify-content:center;gap:25px;flex:1}.nav a{font-size:14px;color:#e0e7db;white-space:nowrap}.nav a:hover,.nav a.active{color:var(--gold)}.head-actions{display:flex;align-items:center;gap:14px}.cart-link{font-size:22px;padding:4px}.cart-count{font-size:11px;vertical-align:top;color:var(--gold)}.pill{border:0;border-radius:30px;background:var(--gold);color:#1b2118;padding:12px 23px;font-weight:600}.mobile-menu{display:none;background:none;border:0;color:white;font-size:24px}.hero{min-height:520px;padding:58px 16px 50px;display:flex;align-items:flex-start;position:relative;overflow:hidden;color:white;background:linear-gradient(90deg,#063722ed 0%,#063722a8 47%,#06372212 100%),url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=2000&q=85') center 50%/cover}.hero-inner{max-width:700px;position:relative;z-index:1}.eyebrow{font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:var(--green2);font-weight:600}.hero .eyebrow{color:var(--gold);margin:3px 0 22px}.hero h1{font:800 clamp(40px,5vw,62px)/1.2 var(--serif);margin:0 0 23px;max-width:740px}.hero p{max-width:550px;font-size:18px;line-height:1.6;color:#f0efe4;margin:0 0 30px}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{padding:12px 20px;border-radius:26px;border:1px solid var(--line);background:var(--paper);font-weight:600;display:inline-flex;align-items:center;gap:9px}.btn.primary{background:var(--green2);color:white;border-color:var(--green2)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#1e2119}.btn.ghost{background:transparent;color:white;border-color:#ffffff77}.section{padding:54px 16px}.section.tint{background:var(--lime)}.section h2,.page-hero h1{font:700 clamp(30px,4vw,44px)/1.18 var(--serif);margin:10px 0 8px}.sub{color:var(--muted);font-size:17px;line-height:1.6;margin:0}.flow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:38px}.flow span{border:1px solid var(--line);border-radius:30px;background:#fffefa;padding:10px 16px;white-space:nowrap}.flow b{color:var(--green2)}.grid{display:grid;gap:20px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border:1px solid var(--line);background:var(--paper);border-radius:23px;box-shadow:var(--shadow);padding:25px}.card h3{font:700 20px var(--serif);margin:12px 0 8px}.card p{color:var(--muted);line-height:1.55;margin:0}.card-link{display:inline-block;margin-top:15px;color:var(--green2);font-weight:600}.icon{font-size:25px;color:var(--green2)}.feature-grid{margin-top:32px}.role-grid{margin-top:32px}.page-hero{padding:58px 16px;background:var(--lime);border-bottom:1px solid var(--line)}.page-hero .sub{max-width:720px}.content{padding:32px 16px 58px}.tabs{display:flex;border:1px solid var(--line);border-radius:30px;background:var(--paper);padding:4px;width:max-content;margin-bottom:24px}.tab{border:0;border-radius:26px;background:none;padding:9px 20px;color:#48584b}.tab.selected{background:var(--green2);color:white}.market-layout{display:grid;grid-template-columns:250px 1fr;gap:30px}.filters label,.form label{display:block;font-size:14px;margin:0 0 7px}.field{width:100%;border:1px solid var(--line);border-radius:15px;padding:10px 13px;background:#fffefa;margin:0 0 18px;outline-color:var(--green2)}input[type=range]{width:100%;accent-color:var(--green2)}.checks{display:flex;gap:8px;align-items:center;margin-top:12px}.listings-head{color:var(--muted);margin:0 0 17px}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.product{padding:0;overflow:hidden}.product img{width:100%;height:178px;object-fit:cover;display:block}.product-body{padding:19px}.product-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.grade{background:#e1efe3;color:var(--green2);font-size:12px;padding:4px 11px;border-radius:20px;white-space:nowrap}.small{font-size:13px;color:var(--muted);margin-top:6px}.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:17px}.price{font:700 23px var(--serif)}.price small{font-size:15px;font-weight:400}.add{border:0;border-radius:24px;background:var(--green2);color:#fff;padding:11px 20px;font-weight:600}.badge{display:inline-block;padding:8px 13px;border-radius:22px;background:#e9f0d9;margin:18px 8px 0 0}.split{display:grid;grid-template-columns:2fr 1fr;gap:30px}.basket-empty{min-height:340px;display:grid;place-items:center;color:var(--muted)}.summary h3{font:600 16px var(--sans);margin:0 0 12px}.summary-line{display:flex;justify-content:space-between;margin:8px 0;color:#405045}.summary-total{border-top:1px solid var(--line);padding-top:12px;margin-top:10px;font-size:18px;font-weight:700}.wide{width:100%;justify-content:center}.machine .status{float:right;border-radius:20px;padding:5px 10px;background:#e1efe3;font-size:12px}.machine .status.warn{background:#f7e7ca}.menu-item{display:flex;gap:16px;align-items:center}.big-emoji{font-size:36px}.story-flow{background:var(--cream)}.story-flow .flow span{background:#e9f0d9;border:0}.form-wrap{max-width:540px;margin:52px auto 80px;padding:0 18px}.form-wrap h1{font:700 38px var(--serif);margin:0 0 5px}.form-wrap .sub{margin-bottom:25px}.role-select{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0 18px}.role-option{border:1px solid var(--line);border-radius:18px;padding:17px;background:var(--paper);text-align:left}.role-option.selected{border:2px solid var(--green2)}.form .field{height:43px;margin:6px 0 17px}.form .btn{margin-top:0}.form-center{text-align:center}.footer{background:var(--green);color:#e7eddf;padding:32px 16px;text-align:center}.hidden{display:none!important}.toast{position:fixed;right:22px;bottom:20px;background:var(--green);color:white;padding:14px 19px;border-radius:14px;box-shadow:var(--shadow);z-index:20}.dash-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.stat{font:700 30px var(--serif);color:var(--green2)}.list-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}@media(max-width:900px){.grid.four{grid-template-columns:repeat(2,1fr)}.nav{gap:12px}.nav a{font-size:12px}.market-layout{grid-template-columns:210px 1fr}}@media(max-width:650px){header{height:58px;padding:0 11px;gap:10px}.brand{font-size:19px}.logo{width:35px;height:35px}.mobile-menu{display:block;margin-left:auto}.nav{display:none;position:absolute;top:58px;left:0;right:0;background:var(--green);padding:15px;align-items:flex-start;flex-direction:column}.nav.open{display:flex}.head-actions{gap:6px}.head-actions .pill{padding:10px 14px}.hero{min-height:560px;padding:50px 18px;background-position:60% center}.hero h1{font-size:42px}.hero p{font-size:16px}.section,.content{padding:35px 14px}.page-hero{padding:42px 14px}.grid.four,.grid.three,.grid.two,.product-grid{grid-template-columns:1fr}.market-layout,.split{grid-template-columns:1fr}.filters{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.filters .search-full{grid-column:1/-1}.form-wrap{margin:42px auto 64px}.flow{margin-top:26px}.card{padding:21px}}
</style>
<style>
/* Compact catalog photos, matching the reference marketplace */
.product-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.product.card{border-radius:14px;border-color:#ecebe7;box-shadow:0 4px 12px #17291b0c}
.product-image{height:180px;background:#fff;position:relative;display:grid;place-items:center;border-bottom:1px solid #f0eee8;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:contain;padding:12px;background:#fff}
.product-body{padding:13px 14px 15px}
.product .product-title h3{font:600 16px var(--sans)}
.product .price-row{margin-top:13px}
.product .price{font-size:20px}
.brand .logo{overflow:hidden;padding:0}
.brand .logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.4) translateY(18%)}
.header-logo{width:60px;height:60px;object-fit:contain;background:#fff;border:1px solid #dfe8d6;border-radius:8px;flex:none}
@media(max-width:1050px){.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:780px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body><header><a class="brand" href="#home" aria-label="AgroSync home"><span class="logo"><img src="./agrosync-logo.png" alt=""></span><span>AgroSync</span></a><button class="mobile-menu" id="menu">☰</button><nav class="nav" id="nav"><a href="#marketplace">Marketplace</a><a href="#membership">Membership</a><a href="#agri-mart">Agri-Mart</a><a href="#vending">Vending</a><a href="#sustainability">Sustainability</a><a href="#about">About</a></nav><div class="head-actions"><a class="cart-link" href="#basket" aria-label="Basket">♧<sup class="cart-count" id="cart-count"></sup></a><a class="pill" id="auth-link" href="#signin">Sign in</a></div></header><main id="app"></main><div id="toast" class="toast hidden"></div><script>
const app=document.querySelector('#app');let basket=JSON.parse(localStorage.getItem('agrosync-basket')||'[]');let role='Farmer';let activeTab='Browse produce';let maxPrice=100;let search='';let category='All';let grade='Any';let inStock=false;let fulfil='delivery';let toastTimer;
let products=[{name:'Madanapalli Tomato',farmer:'Ramesh Reddy',village:'Basinikonda',date:'2026-10-13',price:28,qty:420,category:'Vegetables',grade:'A',img:'photo-1546094096-0df4bcaaa337'},{name:'Red Onion',farmer:'Lakshmi Devi',village:'Kotha Indlu',date:'2026-10-10',price:34,qty:300,category:'Vegetables',grade:'A',img:'photo-1518977676601-b53f82aba655'},{name:'Madanapalli Mango',farmer:'Suresh Naidu',village:'Nimmanapalle',date:'2026-10-12',price:65,qty:180,category:'Fruits',grade:'A',img:'photo-1553279768-865429fa0078'},{name:'Fresh Spinach',farmer:'Anitha Reddy',village:'Kurabalakota',date:'2026-10-14',price:22,qty:95,category:'Vegetables',grade:'B',img:'photo-1576045057995-568f588f82fb'},{name:'Sweet Bananas',farmer:'Chandra Sekhar',village:'Madanapalli',date:'2026-10-11',price:40,qty:240,category:'Fruits',grade:'A',img:'photo-1571771894821-ce9b6c11b08e'},{name:'Farm Carrots',farmer:'Padmaja',village:'Ramasamudram',date:'2026-10-12',price:30,qty:120,category:'Vegetables',grade:'B',img:'photo-1445282768818-728615cc910a'},{name:'Green Capsicum',farmer:'Prakash',village:'Basinikonda',date:'2026-10-14',price:38,qty:80,category:'Vegetables',grade:'A',img:'photo-1563565375-f3fdfdbefa83'},{name:'Fresh Guava',farmer:'Venkata Lakshmi',village:'Nimmanapalle',date:'2026-10-13',price:45,qty:150,category:'Fruits',grade:'A',img:'photo-1536511132770-e5058c5e8c46'}];
const h=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function cartCount(){let n=basket.reduce((a,i)=>a+i.count,0);document.querySelector('#cart-count').textContent=n?` ${n}`:''}function saveCart(){localStorage.setItem('agrosync-basket',JSON.stringify(basket));cartCount()}function notify(text){let t=document.querySelector('#toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2400)}function go(hash){location.hash=hash}
function headerHero(tag,title,sub){return `<section class="page-hero"><div class="eyebrow">${tag}</div><h1>${title}</h1><p class="sub">${sub}</p></section>`}function card(icon,title,desc,link){return `<article class="card"><div class="icon">${icon}</div><h3>${title}</h3><p>${desc}</p>${link?`<a class="card-link" href="${link}">Open ${title} interface →</a>`:''}</article>`}
function home(){return `<section class="hero"><div class="hero-inner"><div class="eyebrow">Pilot · Madanapalli Mandal, AP</div><h1>Innovating Agriculture. Empowering Farmers.</h1><p>Farmers lose income to middlemen and spoilage while families struggle to find fresh produce. AgroSync links the farm, the Mandal Agri-Mart and your doorstep — with AI to guide every step.</p><div class="actions"><a class="btn gold" href="#marketplace">Shop fresh produce →</a><a class="btn ghost" href="#signup">I’m a farmer</a><a class="btn ghost" href="#signup">Partner with us</a></div></div></section><section class="section"><h2>How AgroSync works</h2><p class="sub">A transparent chain from field to plate — and back to the field.</p><div class="flow">${['Farmer','Listing','Collection','Quality check','AI grading','Inventory','Marketplace','Delivery','Vermicompost'].map((x,i)=>`<span><b>${i+1}</b> &nbsp;${x}</span>${i<8?'<i>→</i>':''}`).join('')}</div></section><section class="section tint"><h2>Smart agriculture, built in</h2><div class="grid four feature-grid">${[['↗','Live insights','Clear pricing, crop demand and practical guidance.'],['♧','AI assistance','Smarter grading and recommendations at every step.'],['⌕','Quality checks','Consistent produce grading at the Mandal hub.'],['♻','Zero waste','Unsold produce can return to the soil as compost.']].map(x=>card(...x)).join('')}</div></section><section class="section"><h2>Four interfaces, one ecosystem</h2><p class="sub">Choose your view of AgroSync.</p><div class="grid four role-grid">${[['🌱','Farmer','List your harvest, see what the Mandal accepted, and watch what your crop is selling for.','#dashboard-farmer'],['▤','Mandal Operator','Receive lots, grade and store produce, and keep the mart and every machine stocked.','#dashboard-operator'],['🧺','Consumer','Shop graded produce, join a family membership, and rate what you received.','#dashboard-consumer'],['♧','Delivery Agent','Pick up drops available on your route and log each handover.','#dashboard-delivery']].map(x=>`<article class="card"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><a class="card-link" href="${x[3]}">Open ${x[1]} interface →</a></article>`).join('')}</div></section><section class="section tint"><h2>Fresh from the farm</h2><p class="sub">Graded at the Mandal. Ready for your table.</p><div class="actions" style="margin-top:20px"><a class="btn primary" href="#marketplace">Browse the marketplace →</a><a class="btn" href="#membership">Explore membership</a></div></section>`}
function productCard(p){let image=p.imageUrl||(p.name==='Red Onion'?'https://images.unsplash.com/photo-1562746713-0c512f966832?auto=format&fit=crop&w=700&q=85':`https://images.unsplash.com/${p.img}?auto=format&fit=crop&w=700&q=85`);return `<article class="card product"><div class="product-image"><img src="${h(image)}" alt="${h(p.name)}"></div><div class="product-body"><div class="product-title"><h3 style="margin:0">${h(p.name)}</h3><span class="grade">Grade ${p.grade}</span></div><div class="small">${h(p.farmer)}</div><div class="small">♧ ${h(p.village)} · Harvest ${p.date}</div><div class="price-row"><div><div class="price">₹${p.price}<small>/kg</small></div><div class="small">${p.qty} kg available</div></div><button class="add" data-add="${p.name}">Add</button></div></div></article>`}
function marketplace(){let ps=products.filter(p=>(!search||`${p.name} ${p.farmer} ${p.village}`.toLowerCase().includes(search.toLowerCase()))&&(category==='All'||p.category===category)&&(grade==='Any'||p.grade===grade)&&p.price<=maxPrice&&(!inStock||p.qty>0));return `${headerHero('Marketplace','Fresh from the farm, graded at the Mandal','Every listing is quality-checked at the Mandal Agri-Mart before it reaches you.')}<section class="content"><div class="tabs"><button class="tab ${activeTab==='Browse produce'?'selected':''}" data-tab="Browse produce">Browse produce</button><button class="tab ${activeTab==='Reviews'?'selected':''}" data-tab="Reviews">Reviews</button></div>${activeTab==='Reviews'?`<h2>What customers say</h2><div class="grid three">${card('★★★★★','Fresh and delicious','The tomatoes arrived same day and tasted like they came straight from the farm.')}${card('★★★★★','Great quality','Every vegetable was carefully graded and packed.')}${card('★★★★☆','Easy local shopping','I love knowing which farmer grew my food.')}</div>`:`<div class="market-layout"><aside class="filters"><label class="search-full">Search<input class="field" id="search" placeholder="Tomato, farmer, village..." value="${h(search)}"></label><label>Category<select class="field" id="category"><option>All</option><option ${category==='Fruits'?'selected':''}>Fruits</option><option ${category==='Vegetables'?'selected':''}>Vegetables</option></select></label><label>Quality grade<select class="field" id="grade"><option>Any</option><option ${grade==='A'?'selected':''}>A</option><option ${grade==='B'?'selected':''}>B</option></select></label><label class="search-full">Max price: ₹${maxPrice}<input id="price" type="range" min="10" max="100" value="${maxPrice}"></label><label class="checks search-full"><input type="checkbox" id="stock" ${inStock?'checked':''}> In stock only</label></aside><div><div class="listings-head">${ps.length} listings</div><div class="product-grid">${ps.length?ps.map(productCard).join(''):'<p>No produce matches those filters.</p>'}</div></div></div>`}</section>`}
function membership(){return `${headerHero('Membership','A little more value in every basket','Join the AgroSync Green Card and enjoy affordable fresh food and member rewards.')}<section class="content"><div class="card" style="padding:clamp(22px,5vw,54px);background:linear-gradient(130deg,#f7f8e9,#eaf5d8)"><div class="grid two" style="align-items:center"><div><div class="eyebrow">AgroSync Green Card</div><h2 style="font:700 clamp(32px,5vw,48px) var(--serif)">Affordable · Long-term · More Value</h2><p class="sub">One simple membership for your household’s everyday produce.</p></div><div class="card" style="background:linear-gradient(130deg,#0c542d,#062f1d);color:white;text-align:center"><div class="eyebrow" style="color:#d5ef57">AgroSync Green Card</div><div style="font:800 56px var(--serif);margin:12px 0">₹299</div><div>18 months validity · Single member</div></div></div><div style="overflow:auto;margin-top:30px"><table style="width:100%;border-collapse:collapse;background:#fffefa"><thead><tr style="background:var(--green2);color:white"><th style="padding:13px;text-align:left">Benefit</th><th style="padding:13px">AgroSync Green Card</th></tr></thead><tbody>${[['Membership Price','₹299'],['Validity','18 Months'],['Membership','Single Member Only'],['Discount on Eligible Produce','5% on fruits & vegetables'],['Special Festival Offers','Sankranti, Ugadi, Dasara etc.'],['Reward Points','On every purchase'],['Fresh & Direct from Farmers','✓'],['Online Ordering','Through Mandal Mart / Online Platform']].map(x=>`<tr><td style="padding:12px;border-bottom:1px solid var(--line)">${x[0]}</td><td style="padding:12px;text-align:center;border-bottom:1px solid var(--line)">${x[1]}</td></tr>`).join('')}</tbody></table></div><div class="form-center" style="margin-top:24px"><button class="btn primary" id="choose-card">Choose Green Card →</button></div></div></section>`}
function agriMart(){return `<section class="section"><div class="grid three">${[['▧','Collection','Scheduled pickups and farmer drop-offs.'],['⚖','Weighing','Received quantities verified on certified scales.'],['⌕','Grading','AI-assisted Grade A/B/C, confirmed by an operator.'],['▤','Storage','Cold rooms and racks with batch & expiry tracking.'],['▱','Local sales','In-store shopping with Gold member discounts.'],['♧','Distribution','Online orders, vending restock and route partners.']].map((x,i)=>`<article class="card"><div style="display:flex;gap:16px;align-items:center"><span style="font:700 30px var(--serif);color:var(--gold)">${i+1}</span><span class="icon">${x[0]}</span></div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div></section><section class="section tint"><h2>Mandal Agri-Mart</h2><p class="sub">A trusted local hub from farm gate to family table.</p></section>`}
function vending(){return `<section class="content"><div class="tabs"><button class="tab ${activeTab==='Browse produce'?'selected':''}" data-tab="Browse produce">Machines & menu</button><button class="tab ${activeTab==='Reviews'?'selected':''}" data-tab="Reviews">Reviews</button></div>${activeTab==='Reviews'?'<h2>Customer reviews</h2><p class="sub">Fresh drinks, close to home. Reviews are coming soon.</p>':`<div class="grid three">${[['🧃','Fruit juices','Mango, mosambi, watermelon'],['🥕','Vegetable juices','Carrot-beet, cucumber-mint'],['🍉','Fruit salads','Seasonal mixed bowls']].map(x=>`<article class="card menu-item"><span class="big-emoji">${x[0]}</span><div><h3 style="margin:0 0 3px">${x[1]}</h3><p>${x[2]}</p></div></article>`).join('')}</div><h2 style="font-size:25px;margin:54px 0 20px">Find a machine</h2><div class="grid three">${[['Madanapalli Bus Stand','VM-MDP-01','4.2°C','Mango Juice','18 left','Carrot-Beet Juice','6 left','Fruit Salad Bowl','12 left','Online'],['Govt. Hospital Gate','VM-MDP-02','3.8°C','Mosambi Juice','22 left','Cucumber-Mint Juice','3 left','Fruit Salad Bowl','9 left','Online'],['BT College Campus','VM-MDP-03','7.9°C','Watermelon Juice','Out of stock','Fruit Salad Bowl','2 left','','','Maintenance']].map(m=>`<article class="card machine"><span class="status ${m[9]==='Online'?'':'warn'}">${m[9]}</span>${m[0]}<div class="small">${m[1]}</div><p style="margin-top:12px">Chilled at ${m[2]}</p><div class="list-row"><span>${m[3]}</span><span>${m[4]}</span></div><div class="list-row"><span>${m[5]}</span><span>${m[6]}</span></div><div class="list-row"><span>${m[7]}</span><span>${m[8]}</span></div></article>`).join('')}</div>`}</section>`}
function sustainability(){return `${headerHero('Sustainability','Nothing good goes to waste','Unsold or damaged produce that’s unfit for sale is segregated and, where suitable, turned into vermicompost.')}<section class="content story-flow"><div class="flow">${['Segregation','Suitable organic waste','Vermicompost beds','Curing & packing','Back to farmers'].map((x,i)=>`<span>${x}</span>${i<4?'<i>→</i>':''}`).join('')}</div><div class="grid three" style="margin-top:38px">${card('♻','Segregation first','Plastics, packaging and non-compostables are separated at source.')}${card('▤','Tracked inputs','Every kilogram sent to compost is logged against its batch.')}${card('🌱','Closing the loop','Finished compost can be offered back to partner farmers.')}</div></section>`}
function about(){return `${headerHero('About','A fairer, fresher food system — starting in Madanapalli','AgroSync is an AI-powered decision-support and farm-to-consumer platform.')}<section class="content"><div class="grid two">${card('','The problem','Small farmers sell with little price visibility, long middleman chains and high post-harvest loss. Consumers pay more for produce that is less fresh.')}${card('','Our solution','A Mandal-level hub for collection and grading, an online marketplace, community delivery, healthy vending and vermicomposting — tied together with AI insights.')}${card('','Vision','Every Mandal with a transparent, data-driven, zero-waste local food economy.')}${card('','Mission','Raise farmer income, cut avoidable food waste and make fresh produce accessible to every household.')}${card('','Team','Team details coming soon.')}</div></section>`}
function basketPage(){let subtotal=basket.reduce((a,i)=>a+i.price*i.count,0),delivery=fulfil==='collect'?0:20;return `${headerHero('Checkout','Your basket','')}<section class="content"><div class="split"><div class="card">${basket.length?basket.map(i=>`<div class="list-row" style="align-items:center"><div><b>${h(i.name)}</b><div class="small">₹${i.price}/kg</div></div><div style="display:flex;gap:9px;align-items:center"><button class="btn" data-qty="${h(i.name)}" data-delta="-1">−</button>${i.count}<button class="btn" data-qty="${h(i.name)}" data-delta="1">+</button><button class="btn" data-remove="${h(i.name)}">Remove</button></div><b>₹${i.price*i.count}</b></div>`).join(''):'<div class="basket-empty">Your basket is empty. &nbsp; <a href="#marketplace" style="color:var(--green2);font-weight:600">Browse produce</a></div>'}</div><aside class="card summary"><h3>Fulfilment</h3><label class="checks"><input type="radio" name="fulfil" value="delivery" ${fulfil==='delivery'?'checked':''}> Community delivery (₹20)</label><label class="checks"><input type="radio" name="fulfil" value="collect" ${fulfil==='collect'?'checked':''}> Collect at Mandal Agri-Mart (free)</label><div class="list-row" style="margin-top:17px"><span>Subtotal</span><span>₹${subtotal}</span></div><div class="list-row"><span>Member discount</span><span>−₹0</span></div><div class="list-row"><span>Delivery</span><span>₹${basket.length?delivery:0}</span></div><div class="summary-total">Total <span style="float:right">₹${basket.length?subtotal+delivery:0}</span></div><p class="small" style="margin:17px 0">Members save on eligible produce. <a href="#membership" style="color:var(--green2)">See plans</a></p><button class="btn primary wide" id="order" ${basket.length?'':'disabled style="opacity:.4"'}>Place order</button></aside></div></section>`}
function auth(signup=false){return `<section class="form-wrap"><h1>${signup?'Create your AgroSync account':'Sign in to AgroSync'}</h1><p class="sub">${signup?'Choose your interface and sign up with your email.':'Use your email to open your dashboard.'}</p><form class="form" id="auth-form" data-signup="${signup}">${signup?`<div class="role-select">${['Farmer','Mandal Operator','Consumer','Delivery Agent'].map(r=>`<button type="button" class="role-option ${role===r?'selected':''}" data-role="${r}">${r}</button>`).join('')}</div>`:''}<label>Email<input class="field" type="email" name="email" required></label><label>Password<input class="field" type="password" name="password" required minlength="6"></label><button class="btn primary wide">${signup?'Sign up':'Sign in'}</button></form><div class="form-center" style="margin-top:15px"><a href="${signup?'#signin':'#signup'}" style="color:var(--green2)">${signup?'Already have an account? Sign in':'New here? Create an account'}</a></div></section>`}
function dashboard(r){let data={Farmer:['My harvests','Create a listing','Madanapalli Tomato · Grade A · ₹28/kg','Onion · Pickup scheduled for tomorrow'], 'Mandal Operator':['Mandal operations','Receive produce','12 lots awaiting grading','Cold room · 68% capacity'],Consumer:['Welcome to AgroSync','Your recent orders','Order #AS-1042 · Delivered','Green Card · Not yet a member'],'Delivery Agent':['Today’s route','Available drops','3 stops · 8.4 km route','Bus Stand area · 2 orders']}[r]||[];return `<section class="page-hero"><div class="eyebrow">${h(r)} interface</div><h1>${data[0]}</h1><p class="sub">Welcome to your AgroSync workspace, ${h(r.toLowerCase())}.</p></section><section class="content"><div class="dash-head"><h2 style="margin:0">${data[1]}</h2><button class="btn primary" id="dash-action">${r==='Farmer'?'＋ Add harvest':r==='Mandal Operator'?'＋ Receive lot':r==='Consumer'?'Shop produce':'View route'}</button></div><div class="grid two" style="margin-top:24px"><article class="card"><div class="eyebrow">Overview</div><div class="stat">${r==='Farmer'?'₹12,480':r==='Mandal Operator'?'12 lots':r==='Consumer'?'3 orders':'3 stops'}</div><p>${r==='Farmer'?'Earned this month':r==='Mandal Operator'?'Need operator review':r==='Consumer'?'Orders this month':'Assigned today'}</p></article><article class="card"><div class="eyebrow">Next step</div><h3>${data[2]}</h3><p>${data[3]}</p></article></div><div class="grid three" style="margin-top:22px"><a class="card" href="#marketplace"><div class="icon">🧺</div><h3>Marketplace</h3><p>Browse fresh, graded produce.</p></a><a class="card" href="#agri-mart"><div class="icon">▤</div><h3>Agri-Mart</h3><p>Local hub operations and updates.</p></a><a class="card" href="#membership"><div class="icon">🌱</div><h3>Green Card</h3><p>Membership benefits and rewards.</p></a></div></section>`}
function render(){let route=location.hash.slice(1)||'home';if(route==='home')app.innerHTML=home();else if(route==='marketplace')app.innerHTML=marketplace();else if(route==='membership')app.innerHTML=membership();else if(route==='agri-mart')app.innerHTML=agriMart();else if(route==='vending')app.innerHTML=vending();else if(route==='sustainability')app.innerHTML=sustainability();else if(route==='about')app.innerHTML=about();else if(route==='basket')app.innerHTML=basketPage();else if(route==='signin')app.innerHTML=auth();else if(route==='signup')app.innerHTML=auth(true);else if(route.startsWith('dashboard-')){let r={'dashboard-farmer':'Farmer','dashboard-operator':'Mandal Operator','dashboard-consumer':'Consumer','dashboard-delivery':'Delivery Agent'}[route];app.innerHTML=dashboard(r)}else app.innerHTML=home();document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+route));cartCount();bind()}
function bind(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.name===b.dataset.add),i=basket.find(x=>x.name===p.name);i?i.count++:basket.push({...p,count:1});saveCart();notify(`${p.name} added to your basket`)});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{basket=basket.filter(i=>i.name!==b.dataset.remove);saveCart();render()});document.querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{let i=basket.find(x=>x.name===b.dataset.qty);i.count+=Number(b.dataset.delta);if(i.count<=0)basket=basket.filter(x=>x!==i);saveCart();render()});document.querySelectorAll('input[name=fulfil]').forEach(b=>b.onchange=()=>{fulfil=b.value;render()});let s=document.querySelector('#search');if(s)s.oninput=()=>{search=s.value;let pos=s.selectionStart;render();let q=document.querySelector('#search');q.focus();q.setSelectionRange(pos,pos)};let c=document.querySelector('#category');if(c)c.onchange=()=>{category=c.value;render()};let g=document.querySelector('#grade');if(g)g.onchange=()=>{grade=g.value;render()};let p=document.querySelector('#price');if(p)p.onchange=()=>{maxPrice=Number(p.value);render()};let st=document.querySelector('#stock');if(st)st.onchange=()=>{inStock=st.checked;render()};let authForm=document.querySelector('#auth-form');if(authForm)authForm.onsubmit=e=>{e.preventDefault();notify('Demo sign-in complete');location.hash='#dashboard-'+({'Farmer':'farmer','Mandal Operator':'operator','Consumer':'consumer','Delivery Agent':'delivery'}[role])};let choose=document.querySelector('#choose-card');if(choose)choose.onclick=()=>notify('Green Card selected — demo only');let order=document.querySelector('#order');if(order)order.onclick=()=>{if(basket.length){notify('Demo order placed. Thank you!');basket=[];saveCart();render()}};let da=document.querySelector('#dash-action');if(da)da.onclick=()=>location.hash='marketplace'}
document.querySelector('#menu').onclick=()=>document.querySelector('#nav').classList.toggle('open');document.querySelector('#nav').onclick=e=>{if(e.target.closest('a'))document.querySelector('#nav').classList.remove('open')};window.addEventListener('hashchange',render);render();
</script><script src="./workflow-demo.js"></script></body></html>
